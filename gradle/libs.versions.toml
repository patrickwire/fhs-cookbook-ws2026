# Zentraler Version Catalog — DIE eine Quelle für alle Versionen (Vault: Tech-Stand & Versionen).
# Studierende ändern hier NICHTS. Stand 2026-07-24, vor Kursstart gegengeprüft.
[versions]
agp = "9.2.0"                    # Android Gradle Plugin — braucht Gradle >= 9.4.1 (Wrapper gepinnt)
kotlin = "2.4.0"                 # == Compose-Compiler- UND Serialization-Plugin-Version!
composeBom = "2026.05.00"
coreKtx = "1.19.0"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
navigationCompose = "2.9.8"
camerax = "1.6.1"
retrofit = "3.0.0"
junit = "4.13.2"
serializationJson = "1.9.0"
coroutines = "1.10.2"
coil = "3.3.0"
okhttp = "5.1.0"
androidxJunitExt = "1.2.1"

[libraries]
androidx-core-ktx            = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose    = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
compose-bom                  = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui                   = { group = "androidx.compose.ui", name = "ui" }
compose-ui-tooling           = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview   = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material3            = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons-core  = { group = "androidx.compose.material", name = "material-icons-core" }
compose-ui-test-junit4       = { group = "androidx.compose.ui", name = "ui-test-junit4" }
compose-ui-test-manifest     = { group = "androidx.compose.ui", name = "ui-test-manifest" }
lifecycle-runtime-compose    = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-viewmodel-compose  = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
navigation-compose           = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
retrofit                     = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-kotlinx-serialization = { group = "com.squareup.retrofit2", name = "converter-kotlinx-serialization", version.ref = "retrofit" }
kotlinx-serialization-json   = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serializationJson" }
kotlinx-coroutines-android   = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test      = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
coil-compose                 = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-okhttp          = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }
camera-camera2               = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
camera-lifecycle             = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
camera-view                  = { group = "androidx.camera", name = "camera-view", version.ref = "camerax" }
junit                        = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit-ext           = { group = "androidx.test.ext", name = "junit", version.ref = "androidxJunitExt" }

[plugins]
android-application  = { id = "com.android.application", version.ref = "agp" }
kotlin-android       = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose       = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
